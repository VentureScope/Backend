# Legacy VM compose (API + worker only, no TLS proxy).
# Preferred production path (AWS EC2 Free plan):
#   deploy/aws/docker-compose.yml  (+ Caddy)
# See docs/deployment/AWS_FREE_TIER.md
#
# All configuration comes from .env (external Supabase + Upstash Redis).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: venturescope-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Waiting for external services...' &&
        sleep 5 &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    container_name: venturescope-worker
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.celery_config.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=1",
      ]

networks:
  default:
    name: venturescope-network
