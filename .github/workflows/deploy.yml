name: Deploy to AWS EC2

# Builds happen ON the EC2 host. This workflow SSHes in and runs deploy/aws/deploy.sh.
# Required secrets:
#   AWS_EC2_HOST         — public IP or Elastic IP of the instance
#   AWS_EC2_USER         — SSH user (ubuntu)
#   AWS_EC2_SSH_KEY       — private key (PEM)
#   AWS_EC2_DEPLOY_PATH   — absolute path to Backend on the instance
#                          e.g. /opt/venturescope/Backend

on:
  push:
    branches: [master-v2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.AWS_EC2_DEPLOY_PATH }}"
            git fetch origin master-v2
            git checkout master-v2
            git pull --ff-only origin master-v2
            bash deploy/aws/deploy.sh
