name: Deploy to Azure Container Apps

on:
  push:
    branches: [master-v2]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}-worker:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository-url }}
            org.opencontainers.image.title=venturescope-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure Container Apps
        run: |
          az containerapp update \
            --name venturescope \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy Worker to Azure Container Apps
        run: |
          az containerapp update \
            --name venturescope-worker \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ghcr.io/${{ github.repository }}-worker:${{ github.sha }}