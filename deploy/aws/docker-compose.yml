# AWS EC2 (Free plan) — production stack
# Also works on any Ubuntu VM (Hetzner, Oracle, etc.)
# External: Supabase Postgres, Upstash Redis, Mailgun, LLM APIs
#
#   docker compose -f deploy/aws/docker-compose.yml --env-file .env up -d --build

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: venturescope-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - venturescope

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: venturescope-api:local
    container_name: venturescope-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - venturescope

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    image: venturescope-worker:local
    container_name: venturescope-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    command:
      [
        "celery",
        "-A",
        "app.celery_config.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=1",
      ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - venturescope

networks:
  venturescope:
    name: venturescope-network

volumes:
  caddy_data:
  caddy_config:
